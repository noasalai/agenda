<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Agenda dacvarest.fr</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --card:#f8fafc;
      --shadow: 0 6px 18px rgba(15,23,42,.08);
      --radius:14px;
      --gap:14px;
    }

    .logo-img{
      height: 100px;
      width: auto;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:var(--bg);
    }
    .wrap{
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 18px 32px;
    }

    /* Header */
    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding: 10px 0 18px;
      border-bottom:1px solid var(--line);
      margin-bottom: 18px;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      min-width:260px;
    }
    .brand .title{
      line-height:1.2;
    }
    .brand .title b{display:block;font-size:16px}
    .brand .title span{font-size:12px;color:var(--muted)}
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      font-size:12px;
      color:var(--muted);
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
      white-space:nowrap;
    }
    .chip .dot{
      width:10px;height:10px;border-radius:999px;
      background:#93c5fd;
      border:1px solid rgba(15,23,42,.08);
    }
    .chip .dot.info{background:#fca5a5}
    .chip .dot.atelier{background:#a7f3d0}
    .chip .dot.event{background:#fde68a}
    .selectors{
      display:flex; gap:10px; align-items:center;
      flex-wrap:wrap;
    }
    select, input[type="search"]{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      background:#fff;
      outline:none;
      min-height:40px;
    }
    input[type="search"]{min-width: 240px}

    /* Checkbox */
    .check{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      font-size:13px;
      color:var(--muted);
      white-space:nowrap;
    }
    .check input{ accent-color:#1d4ed8; }

    /* Titles */
    .monthTitle{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      margin: 12px 0 12px;
    }
    .monthTitle h2{
      margin:0;
      font-size:20px;
      letter-spacing:.2px;
    }
    .monthTitle .hint{color:var(--muted); font-size:12px}

    /* Calendar grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: var(--gap);
    }
    .dow{
      font-weight:700;
      color:#334155;
      font-size:13px;
      padding: 6px 4px;
    }
    .day{
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      min-height: 165px;
      padding: 10px 10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
      min-width:0;
    }
    .day.isWeekend{
      background: #f3f4f6;
    }
    .day .num{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .day .num strong{
      font-size:16px;
    }
    .day .num small{
      color:var(--muted);
      font-size:12px;
    }
    .events{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .card{
      border-radius: 14px;
      padding: 10px 10px 10px;
      background: var(--card);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 1px 0 rgba(15,23,42,.03);
      overflow:hidden;
      min-width:0;
    }
    .card .row1{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      min-width:0;
    }
    .badge{
      font-size:11px;
      color:#0f172a;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(15,23,42,.08);
      white-space:nowrap;
    }
    .card h4{
      margin: 0 0 6px;
      font-size:13px;
      line-height:1.25;
      overflow-wrap:anywhere;
      word-break:break-word;
      min-width:0;
    }
    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color: var(--muted);
      font-size:12px;
      margin-bottom: 8px;
    }
    .meta span{
      display:inline-flex;
      align-items:center;
      gap:6px;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .links{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .links a{
      font-size:12px;
      color:#1d4ed8;
      text-decoration:none;
      padding: 6px 10px;
      border-radius: 10px;
      border:1px solid rgba(29,78,216,.20);
      background:#fff;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .links a:hover{
      border-color: rgba(29,78,216,.45);
      box-shadow: 0 2px 10px rgba(29,78,216,.10);
    }

    .empty{
      border:1px dashed var(--line);
      background: transparent;
      box-shadow:none;
    }

    /* Year view layout */
    .yearWrap{
      display:grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .monthBlock{
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background:#fff;
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
    }
    .monthBlockHeader{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
      margin-bottom: 10px;
    }
    .monthBlockHeader h3{
      margin:0;
      font-size:16px;
    }
    .monthBlockHeader .mini{
      color:var(--muted);
      font-size:12px;
    }

    /* Responsive */
    @media (max-width: 900px){
      .grid{grid-template-columns: repeat(2, minmax(0,1fr));}
      .dow{display:none;}
      .day{min-height: 180px;}
      input[type="search"]{min-width: 180px; width:100%;}
      .controls{justify-content:flex-start;}
    }
    @media (max-width: 640px){
      .grid{grid-template-columns: 1fr;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="https://www.dacvarest.fr/wp-content/uploads/2024/12/logodacvarest-svg.png"
             alt="Logo DAC Var Est"
             class="logo-img">
        <div class="title">
          <b>Agenda dacvarest.fr</b>
          <span>Calendrier alimenté automatiquement (Google Sheet)</span>
        </div>
      </div>

      <div class="controls">
        <div class="chip"><span class="dot event"></span> Événement / atelier / animation</div>
        <div class="chip"><span class="dot info"></span> Info / news / actualité</div>

        <div class="selectors">
          <!-- ✅ Nouveau : Vue -->
          <select id="viewMode" title="Vue">
            <option value="year" selected>Année complète</option>
            <option value="month">Mois</option>
            <option value="week">Semaine</option>
          </select>

          <select id="month"></select>
          <select id="year"></select>

          <!-- ✅ Nouveau : Sélecteur semaine (visible seulement en mode Semaine) -->
          <select id="week" style="display:none"></select>

          <select id="typeFilter">
            <option value="">Tous types</option>
          </select>

          <input id="search" type="search" placeholder="Rechercher (titre, ville, lieu)..." />

          <label class="check" title="Affiche uniquement les jours qui contiennent au moins un événement (par défaut)">
            <input id="onlyWithEvents" type="checkbox" checked>
            Afficher uniquement les jours avec événements
          </label>
        </div>
      </div>
    </div>

    <div class="monthTitle">
      <h2 id="monthLabel">—</h2>
      <div class="hint" id="status">Chargement…</div>
    </div>

    <div class="grid" id="dowRow"></div>

    <!-- Calendrier standard (mois / semaine) -->
    <div class="grid" id="calendar"></div>

    <!-- Vue année -->
    <div class="yearWrap" id="yearWrap" style="display:none"></div>
  </div>

<script>
/** ✅ Colle ton lien CSV publié ici */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGpQYOcOHDjE8YyA1WjJDxGZE3JFBKwpBvMQzIaWiekbf5HNf11owqJFjU9PsaRcExANXdFPhul_In/pub?gid=229654026&single=true&output=csv";

/** Réglages */
const WEEK_START = 1; // 1 = lundi (FR)
const DOW_LABELS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

// Couleurs par défaut par type (si colonne "couleur" vide)
const TYPE_COLORS = {
  "info": "#FFE9D6",
  "webinaire": "#EAF2FF",
  "atelier": "#E7FFF2",
  "événement": "#FFF7CC",
  "evenement": "#FFF7CC",
  "default": "#F8FAFC"
};

const els = {
  viewMode: document.getElementById("viewMode"),
  month: document.getElementById("month"),
  year: document.getElementById("year"),
  week: document.getElementById("week"),
  typeFilter: document.getElementById("typeFilter"),
  search: document.getElementById("search"),
  onlyWithEvents: document.getElementById("onlyWithEvents"),
  monthLabel: document.getElementById("monthLabel"),
  status: document.getElementById("status"),
  dowRow: document.getElementById("dowRow"),
  calendar: document.getElementById("calendar"),
  yearWrap: document.getElementById("yearWrap"),
};

function normalize(s){
  return (s ?? "").toString().trim();
}
function normKey(s){
  return normalize(s).toLowerCase()
    .normalize("NFD").replace(/\p{Diacritic}/gu,"");
}
function parseCSV(text){
  const rows = [];
  let row = [];
  let cur = "";
  let inQuotes = false;

  for (let i=0; i<text.length; i++){
    const c = text[i];
    const next = text[i+1];

    if (c === '"' && inQuotes && next === '"'){ cur += '"'; i++; continue; }
    if (c === '"'){ inQuotes = !inQuotes; continue; }

    if (c === "," && !inQuotes){
      row.push(cur); cur=""; continue;
    }
    if ((c === "\n" || c === "\r") && !inQuotes){
      if (c === "\r" && next === "\n") i++;
      row.push(cur); cur="";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      continue;
    }
    cur += c;
  }
  row.push(cur);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

function toISODate(yyyy_mm_dd){
  const s = normalize(yyyy_mm_dd);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  if (Number.isNaN(dt.getTime())) return null;
  return dt;
}

function setSelectOptions(){
  els.month.innerHTML = "";
  for (let m=0; m<12; m++){
    const opt = document.createElement("option");
    opt.value = String(m+1).padStart(2,"0");
    opt.textContent = MONTHS_FR[m].replace(/^\w/, c => c.toUpperCase());
    els.month.appendChild(opt);
  }
  els.year.innerHTML = "";
  const now = new Date();
  const thisY = now.getFullYear();
  for (let y=thisY-1; y<=thisY+3; y++){
    const opt = document.createElement("option");
    opt.value = String(y);
    opt.textContent = String(y);
    els.year.appendChild(opt);
  }

  // ⚙️ Par défaut : Année complète + année en cours
  els.viewMode.value = "year";
  els.month.value = String(now.getMonth()+1).padStart(2,"0");
  els.year.value = String(thisY);
}

function renderDow(){
  els.dowRow.innerHTML = "";
  for (const lab of DOW_LABELS){
    const div = document.createElement("div");
    div.className = "dow";
    div.textContent = lab;
    els.dowRow.appendChild(div);
  }
}

function monthLabel(y, m){
  return `Agenda – ${MONTHS_FR[m-1].replace(/^\w/, c => c.toUpperCase())} ${y}`;
}
function yearLabel(y){
  return `Agenda – Année ${y}`;
}

function firstGridDate(y, m){
  const first = new Date(Date.UTC(y, m-1, 1));
  const dow = (first.getUTCDay() + 6) % 7; // 0=lun ... 6=dim
  const start = new Date(first);
  start.setUTCDate(first.getUTCDate() - dow);
  return start;
}
function isWeekend(utcDate){
  const day = utcDate.getUTCDay();
  return day === 0 || day === 6;
}
function safeLink(url){
  const u = normalize(url);
  if (!u) return null;
  if (/^https?:\/\//i.test(u)) return u;
  return null;
}
function buildTypeOptions(events){
  const types = Array.from(new Set(events.map(e => e.type).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"fr"));
  els.typeFilter.innerHTML = `<option value="">Tous types</option>`;
  for (const t of types){
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    els.typeFilter.appendChild(opt);
  }
}
function colorForEvent(e){
  if (normalize(e.couleur)) return e.couleur;
  const key = normKey(e.type);
  return TYPE_COLORS[key] || TYPE_COLORS.default;
}
function eventMatchesFilters(e){
  const tf = normalize(els.typeFilter.value);
  if (tf && e.type !== tf) return false;

  const q = normKey(els.search.value);
  if (!q) return true;

  const hay = normKey([e.titre, e.ville, e.lieu, e.type].join(" "));
  return hay.includes(q);
}
function escapeHtml(s){
  return normalize(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function renderEventCard(e){
  const bg = colorForEvent(e);
  const link = safeLink(e.lien);

  const timeStr = (e.heure_debut || e.heure_fin)
    ? `${e.heure_debut || ""}${(e.heure_debut && e.heure_fin) ? " à " : ""}${e.heure_fin || ""}`.trim()
    : "";

  const whereStr = [e.ville, e.lieu].filter(Boolean).join(" · ");

  const card = document.createElement("div");
  card.className = "card";
  card.style.background = bg;

  card.innerHTML = `
    <div class="row1">
      <h4>${escapeHtml(e.titre || "Événement")}</h4>
      ${e.type ? `<span class="badge">${escapeHtml(e.type)}</span>` : ""}
    </div>
    <div class="meta">
      ${timeStr ? `<span>🕒 ${escapeHtml(timeStr)}</span>` : ""}
      ${whereStr ? `<span>📍 ${escapeHtml(whereStr)}</span>` : ""}
    </div>
    <div class="links">
      ${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${escapeHtml(e.etiquette || "Lien")}</a>` : ""}
    </div>
  `;
  return card;
}

/* =========================
   ✅ VUE MOIS (ou base)
   ========================= */
function renderMonth(eventsAll, y, m){
  els.monthLabel.textContent = monthLabel(y,m);

  const eventsMonth = eventsAll
    .filter(e => e.y === y && e.m === m)
    .filter(eventMatchesFilters);

  const byDay = new Map();
  for (const e of eventsMonth){
    const key = e.d;
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  for (const [k, arr] of byDay){
    arr.sort((a,b) => (a.heure_debut||"").localeCompare(b.heure_debut||""));
  }

  els.calendar.innerHTML = "";
  const onlyWithEvents = !!els.onlyWithEvents?.checked;

  // calendrier complet (42 cases)
  if (!onlyWithEvents){
    els.dowRow.style.display = "";
    const start = firstGridDate(y, m);
    const daysToRender = 42;

    for (let i=0; i<daysToRender; i++){
      const dt = new Date(start);
      dt.setUTCDate(start.getUTCDate() + i);

      const cell = document.createElement("div");
      const inMonth = (dt.getUTCFullYear() === y && (dt.getUTCMonth()+1) === m);

      cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "") + (!inMonth ? " empty" : "");

      if (!inMonth){
        els.calendar.appendChild(cell);
        continue;
      }

      const d = dt.getUTCDate();
      const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];
      cell.innerHTML = `
        <div class="num">
          <strong>${d}</strong>
          <small>${dow}</small>
        </div>
        <div class="events"></div>
      `;

      const slot = cell.querySelector(".events");
      const dayEvents = byDay.get(d) || [];
      for (const e of dayEvents){
        slot.appendChild(renderEventCard(e));
      }

      els.calendar.appendChild(cell);
    }

    els.status.textContent = `${eventsMonth.length} élément(s) affiché(s)`;
    return {count: eventsMonth.length};
  }

  // uniquement les jours avec événements
  els.dowRow.style.display = "none";

  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let d=1; d<=daysInMonth; d++){
    const dayEvents = byDay.get(d) || [];
    if (dayEvents.length === 0) continue;

    const dt = new Date(Date.UTC(y, m-1, d));
    const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];

    const cell = document.createElement("div");
    cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "");
    cell.innerHTML = `
      <div class="num">
        <strong>${d}</strong>
        <small>${dow}</small>
      </div>
      <div class="events"></div>
    `;

    const slot = cell.querySelector(".events");
    for (const e of dayEvents){
      slot.appendChild(renderEventCard(e));
    }
    els.calendar.appendChild(cell);
  }

  els.status.textContent = `${eventsMonth.length} élément(s) affiché(s)`;
  return {count: eventsMonth.length};
}

/* =========================
   ✅ VUE ANNÉE
   ========================= */
function renderYear(eventsAll, y){
  els.monthLabel.textContent = yearLabel(y);
  els.status.textContent = "—";

  els.calendar.innerHTML = "";
  els.dowRow.style.display = "none";
  els.yearWrap.innerHTML = "";

  let totalCount = 0;

  for (let m=1; m<=12; m++){
    const block = document.createElement("div");
    block.className = "monthBlock";

    const header = document.createElement("div");
    header.className = "monthBlockHeader";
    header.innerHTML = `
      <h3>${MONTHS_FR[m-1].replace(/^\w/, c => c.toUpperCase())} ${y}</h3>
      <span class="mini" id="mini_${y}_${m}">—</span>
    `;
    block.appendChild(header);

    // une grille par mois
    const grid = document.createElement("div");
    grid.className = "grid";
    block.appendChild(grid);

    // on rend le mois dans cette grille (sans toucher els.calendar)
    const count = renderMonthIntoGrid(eventsAll, y, m, grid);
    totalCount += count;

    header.querySelector(`#mini_${y}_${m}`).textContent = `${count} évènement(s)`;

    // si “uniquement jours avec évènements” et mois vide => on peut masquer le bloc
    if (els.onlyWithEvents.checked && count === 0){
      block.style.display = "none";
    }

    els.yearWrap.appendChild(block);
  }

  els.status.textContent = `${totalCount} élément(s) affiché(s)`;
}

/* Rendu d’un mois dans une grille fournie (utilisé par la vue Année) */
function renderMonthIntoGrid(eventsAll, y, m, targetGrid){
  const eventsMonth = eventsAll
    .filter(e => e.y === y && e.m === m)
    .filter(eventMatchesFilters);

  const byDay = new Map();
  for (const e of eventsMonth){
    const key = e.d;
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  for (const [k, arr] of byDay){
    arr.sort((a,b) => (a.heure_debut||"").localeCompare(b.heure_debut||""));
  }

  const onlyWithEvents = !!els.onlyWithEvents?.checked;
  targetGrid.innerHTML = "";

  // Vue année : on garde un rendu lisible
  // - si onlyWithEvents => uniquement les jours contenant quelque chose
  // - sinon => on affiche le mois complet 42 cases (plus lourd, mais ok)
  if (onlyWithEvents){
    const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
    for (let d=1; d<=daysInMonth; d++){
      const dayEvents = byDay.get(d) || [];
      if (dayEvents.length === 0) continue;

      const dt = new Date(Date.UTC(y, m-1, d));
      const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];

      const cell = document.createElement("div");
      cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "");
      cell.innerHTML = `
        <div class="num">
          <strong>${d}</strong>
          <small>${dow}</small>
        </div>
        <div class="events"></div>
      `;

      const slot = cell.querySelector(".events");
      for (const e of dayEvents){
        slot.appendChild(renderEventCard(e));
      }
      targetGrid.appendChild(cell);
    }
    return eventsMonth.length;
  }

  const start = firstGridDate(y, m);
  const daysToRender = 42;
  for (let i=0; i<daysToRender; i++){
    const dt = new Date(start);
    dt.setUTCDate(start.getUTCDate() + i);

    const cell = document.createElement("div");
    const inMonth = (dt.getUTCFullYear() === y && (dt.getUTCMonth()+1) === m);

    cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "") + (!inMonth ? " empty" : "");
    if (!inMonth){
      targetGrid.appendChild(cell);
      continue;
    }

    const d = dt.getUTCDate();
    const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];
    cell.innerHTML = `
      <div class="num">
        <strong>${d}</strong>
        <small>${dow}</small>
      </div>
      <div class="events"></div>
    `;

    const slot = cell.querySelector(".events");
    const dayEvents = byDay.get(d) || [];
    for (const e of dayEvents){
      slot.appendChild(renderEventCard(e));
    }

    targetGrid.appendChild(cell);
  }
  return eventsMonth.length;
}

/* =========================
   ✅ VUE SEMAINE
   ========================= */
function getWeekRangesForMonth(y, m){
  // retourne des semaines (lundi->dimanche) qui couvrent le mois sélectionné
  const start = firstGridDate(y, m); // lundi de la grille
  const ranges = [];
  for (let i=0; i<42; i+=7){
    const ws = new Date(start);
    ws.setUTCDate(start.getUTCDate()+i);
    const we = new Date(ws);
    we.setUTCDate(ws.getUTCDate()+6);

    // on ne garde que les semaines qui touchent le mois
    const touchesMonth =
      (ws.getUTCFullYear()===y && (ws.getUTCMonth()+1)===m) ||
      (we.getUTCFullYear()===y && (we.getUTCMonth()+1)===m);

    if (touchesMonth){
      ranges.push({ws, we});
    }
  }
  return ranges;
}

function fmtDateShort(dt){
  const d = String(dt.getUTCDate()).padStart(2,"0");
  const m = String(dt.getUTCMonth()+1).padStart(2,"0");
  return `${d}/${m}`;
}

function buildWeekSelect(y, m){
  const ranges = getWeekRangesForMonth(y, m);
  els.week.innerHTML = "";

  ranges.forEach((r, idx)=>{
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = `Semaine ${idx+1} (${fmtDateShort(r.ws)} → ${fmtDateShort(r.we)})`;
    els.week.appendChild(opt);
  });

  // default = 1ère semaine qui contient "aujourd'hui" si possible
  const now = new Date();
  let chosen = 0;
  for (let i=0;i<ranges.length;i++){
    const ws = ranges[i].ws.getTime();
    const we = ranges[i].we.getTime();
    const t = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    if (t>=ws && t<=we){ chosen = i; break; }
  }
  els.week.value = String(chosen);

  return ranges;
}

function renderWeek(eventsAll, y, m, weekIdx){
  const ranges = getWeekRangesForMonth(y, m);
  const r = ranges[weekIdx] || ranges[0];
  if (!r) return;

  els.monthLabel.textContent = `Agenda – Semaine (${fmtDateShort(r.ws)} → ${fmtDateShort(r.we)})`;
  els.dowRow.style.display = "";
  els.calendar.innerHTML = "";

  // events filtrés + sur la plage
  const events = eventsAll
    .filter(eventMatchesFilters)
    .filter(e => {
      const t = Date.UTC(e.y, e.m-1, e.d);
      return t >= r.ws.getTime() && t <= r.we.getTime();
    });

  // map par jour (timestamp UTC)
  const byDay = new Map();
  for (const e of events){
    const key = Date.UTC(e.y, e.m-1, e.d);
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  for (const [k, arr] of byDay){
    arr.sort((a,b) => (a.heure_debut||"").localeCompare(b.heure_debut||""));
  }

  const onlyWithEvents = !!els.onlyWithEvents.checked;

  // si onlyWithEvents = true, on affiche uniquement les jours de la semaine qui ont des events
  if (onlyWithEvents){
    els.dowRow.style.display = "none";
    const days = [];
    for (let i=0;i<7;i++){
      const dt = new Date(r.ws);
      dt.setUTCDate(r.ws.getUTCDate()+i);
      days.push(dt);
    }

    for (const dt of days){
      const key = dt.getTime();
      const dayEvents = byDay.get(key) || [];
      if (dayEvents.length===0) continue;

      const d = dt.getUTCDate();
      const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];

      const cell = document.createElement("div");
      cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "");
      cell.innerHTML = `
        <div class="num">
          <strong>${d}</strong>
          <small>${dow}</small>
        </div>
        <div class="events"></div>
      `;
      const slot = cell.querySelector(".events");
      for (const e of dayEvents){
        slot.appendChild(renderEventCard(e));
      }
      els.calendar.appendChild(cell);
    }

    els.status.textContent = `${events.length} élément(s) affiché(s)`;
    return;
  }

  // sinon => 7 jours, même s’il n’y a rien
  for (let i=0;i<7;i++){
    const dt = new Date(r.ws);
    dt.setUTCDate(r.ws.getUTCDate()+i);

    const d = dt.getUTCDate();
    const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];
    const key = dt.getTime();
    const dayEvents = byDay.get(key) || [];

    const cell = document.createElement("div");
    cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "");
    cell.innerHTML = `
      <div class="num">
        <strong>${d}</strong>
        <small>${dow}</small>
      </div>
      <div class="events"></div>
    `;
    const slot = cell.querySelector(".events");
    for (const e of dayEvents){
      slot.appendChild(renderEventCard(e));
    }
    els.calendar.appendChild(cell);
  }

  els.status.textContent = `${events.length} élément(s) affiché(s)`;
}

/* =========================
   ✅ ROUTER DE VUE
   ========================= */
function updateViewVisibility(){
  const mode = els.viewMode.value;

  // Affichage des éléments UI
  els.yearWrap.style.display = (mode === "year") ? "" : "none";
  els.calendar.style.display = (mode === "year") ? "none" : "";
  els.dowRow.style.display = (mode === "year") ? "none" : "";

  // Mois utile seulement en month/week
  els.month.style.display = (mode === "year") ? "none" : "";
  // Semaine utile seulement en week
  els.week.style.display = (mode === "week") ? "" : "none";
}

function renderByMode(eventsAll){
  const mode = els.viewMode.value;
  const y = Number(els.year.value);
  const m = Number(els.month.value);

  updateViewVisibility();

  if (mode === "year"){
    renderYear(eventsAll, y);
    return;
  }
  if (mode === "week"){
    buildWeekSelect(y, m);
    const idx = Number(els.week.value || "0");
    renderWeek(eventsAll, y, m, idx);
    return;
  }
  // month
  renderMonth(eventsAll, y, m);
}

/* =========================
   ✅ LOAD EVENTS
   ========================= */
async function loadEvents(){
  els.status.textContent = "Chargement…";

  if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("COLLE_TON_LIEN_CSV_ICI")){
    els.status.textContent = "⚠️ Tu dois coller l’URL CSV Google Sheet dans le code.";
    return [];
  }

  const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
  if (!res.ok){
    els.status.textContent = "⚠️ Impossible de charger la Google Sheet (lien CSV ? publication ?).";
    return [];
  }
  const text = await res.text();
  const rows = parseCSV(text);
  if (rows.length < 2){
    els.status.textContent = "⚠️ Aucune donnée (vérifie les colonnes et la publication).";
    return [];
  }

  const header = rows[0].map(h => normKey(h));
  const idx = (name) => header.indexOf(normKey(name));

  if (idx("date") === -1 || idx("titre") === -1){
    els.status.textContent = "⚠️ Colonnes obligatoires manquantes : date + titre.";
    return [];
  }

  const evts = [];
  for (let i=1; i<rows.length; i++){
    const r = rows[i];
    const dateStr = r[idx("date")] ?? "";
    const dt = toISODate(dateStr);
    if (!dt) continue;

    const y = dt.getUTCFullYear();
    const m = dt.getUTCMonth()+1;
    const d = dt.getUTCDate();

    const e = {
      date: dateStr,
      y,m,d,
      titre: r[idx("titre")] ?? "",
      type: r[idx("type")] ?? "",
      heure_debut: r[idx("heure_debut")] ?? "",
      heure_fin: r[idx("heure_fin")] ?? "",
      ville: r[idx("ville")] ?? "",
      lieu: r[idx("lieu")] ?? "",
      lien: r[idx("lien")] ?? "",
      etiquette: r[idx("etiquette")] ?? "Lien",
      couleur: r[idx("couleur")] ?? ""
    };

    if (normalize(e.titre)) evts.push(e);
  }

  return evts;
}

(async function init(){
  setSelectOptions();
  renderDow();

  let eventsAll = [];
  try{
    eventsAll = await loadEvents();
  } catch(err){
    console.error(err);
    els.status.textContent = "⚠️ Erreur lors du chargement (console pour détails).";
    return;
  }

  buildTypeOptions(eventsAll);

  // ✅ Par défaut : Année complète
  renderByMode(eventsAll);

  const refresh = () => renderByMode(eventsAll);

  els.viewMode.addEventListener("change", refresh);
  els.month.addEventListener("change", refresh);
  els.year.addEventListener("change", refresh);
  els.week.addEventListener("change", refresh);
  els.typeFilter.addEventListener("change", refresh);
  els.search.addEventListener("input", refresh);
  els.onlyWithEvents.addEventListener("change", refresh);
})();
</script>
