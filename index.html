<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Agenda dacvarest.fr</title>

  <style>
    :root{
      /* Look institutionnel + DAC */
      --bg:#f7f9fc;
      --surface:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.10);

      /* Bleu DAC (tu peux ajuster) */
      --brand:#3666AE;
      --brand-2:#2E5A9B;

      --shadow: 0 10px 30px rgba(15,23,42,.08);
      --radius:16px;
      --gap:14px;

      /* Badges types */
      --t-event:#fde68a;
      --t-info:#fca5a5;
      --t-web:#bfdbfe;
      --t-atelier:#a7f3d0;

      --card:#f8fafc;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(900px 300px at 30% -10%, rgba(54,102,174,.20), rgba(255,255,255,0)),
        radial-gradient(900px 300px at 80% -10%, rgba(46,90,155,.14), rgba(255,255,255,0)),
        var(--bg);
    }

    .wrap{
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 18px 32px;
    }

    /* Header */
    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding: 12px 0 18px;
      border-bottom:1px solid var(--line);
      margin-bottom: 18px;
    }

    .brand{
      display:flex;
      gap:14px;
      align-items:center;
      min-width:280px;
    }

    .logo-img{
      height: 64px;
      width: auto;
      filter: drop-shadow(0 6px 14px rgba(15,23,42,.10));
    }

    .title{
      line-height:1.2;
    }
    .title b{
      display:block;
      font-size:18px;
      letter-spacing:.2px;
    }
    .title span{
      display:block;
      margin-top:4px;
      font-size:12.5px;
      color:var(--muted);
    }

    .right{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
    }

    .legend{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background: rgba(255,255,255,.70);
      font-size:12px;
      color:var(--muted);
      box-shadow: 0 1px 0 rgba(15,23,42,.03);
      white-space:nowrap;
      backdrop-filter: blur(6px);
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      border:1px solid rgba(15,23,42,.10);
      background:#93c5fd;
    }
    .dot.event{ background: var(--t-event); }
    .dot.info{ background: var(--t-info); }

    .selectors{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }

    select, input[type="search"]{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      background: rgba(255,255,255,.90);
      outline:none;
      min-height:40px;
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
    }
    select:focus, input[type="search"]:focus{
      border-color: rgba(54,102,174,.35);
      box-shadow: 0 0 0 4px rgba(54,102,174,.12);
    }
    input[type="search"]{min-width: 260px}

    .check{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:12px;
      background: rgba(255,255,255,.90);
      font-size:13px;
      color:var(--muted);
      white-space:nowrap;
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
    }
    .check input{ accent-color: var(--brand); }

    /* Title row */
    .monthTitle{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      margin: 12px 0 12px;
    }
    .monthTitle h2{
      margin:0;
      font-size:20px;
      letter-spacing:.2px;
    }
    .monthTitle .hint{color:var(--muted); font-size:12px}

    /* Calendar grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: var(--gap);
    }

    .dow{
      font-weight:700;
      color:#334155;
      font-size:13px;
      padding: 6px 4px;
      opacity:.9;
    }

    .day{
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.92);
      min-height: 170px;
      padding: 10px 10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
      min-width:0;
    }
    .day.isWeekend{
      background: rgba(15,23,42,.03);
    }

    .day .num{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .day .num strong{
      font-size:16px;
      color:#0b1224;
    }
    .day .num small{
      color:var(--muted);
      font-size:12px;
    }

    .events{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    /* Event card */
    .card{
      border-radius: 14px;
      background: var(--card);
      border: 1px solid rgba(15,23,42,.10);
      box-shadow: 0 1px 0 rgba(15,23,42,.03);
      overflow:hidden;
      min-width:0;
    }

    .cardInner{
      padding: 10px 10px 10px;
      border-left: 5px solid rgba(54,102,174,.35);
      background: linear-gradient(90deg, rgba(54,102,174,.06), rgba(255,255,255,0) 60%);
    }

    .cardTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      min-width:0;
    }

    .badge{
      font-size:11px;
      color:#0f172a;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,.12);
      white-space:nowrap;
      background: rgba(255,255,255,.75);
    }

    .card h4{
      margin: 0 0 6px;
      font-size:13.5px;
      line-height:1.28;
      overflow-wrap:anywhere;
      word-break:break-word;
      min-width:0;
      color:#0b1224;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px 10px;
      color: var(--muted);
      font-size:12px;
      margin-bottom: 8px;
    }

    .meta span{
      display:inline-flex;
      align-items:center;
      gap:6px;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .links{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .links a{
      font-size:12px;
      color: var(--brand);
      text-decoration:none;
      padding: 6px 10px;
      border-radius: 10px;
      border:1px solid rgba(54,102,174,.22);
      background:#fff;
      overflow-wrap:anywhere;
      word-break:break-word;
      transition: .15s ease;
    }
    .links a:hover{
      border-color: rgba(54,102,174,.45);
      box-shadow: 0 6px 18px rgba(54,102,174,.12);
      transform: translateY(-1px);
    }

    /* Infographie */
    .thumbWrap{
      margin-top: 10px;
      border-top: 1px dashed rgba(15,23,42,.14);
      padding-top: 10px;
    }
    .thumbTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .thumb{
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,.10);
      background: #fff;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: 0 8px 22px rgba(15,23,42,.08);
    }
    .thumb img{
      width:100%;
      height:auto;
      display:block;
    }

    /* Modal (zoom image) */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.70);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 999;
    }
    .modal.open{ display:flex; }
    .modalCard{
      max-width: 1100px;
      width: 100%;
      max-height: 86vh;
      background: #0b1020;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      overflow:hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .modalBar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      color: rgba(255,255,255,.86);
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
    }
    .modalBar button{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.92);
      border-radius: 12px;
      padding: 8px 10px;
      cursor:pointer;
    }
    .modalBody{
      background:#0b1020;
      overflow:auto;
      max-height: calc(86vh - 46px);
    }
    .modalBody img{
      width: 100%;
      height: auto;
      display:block;
    }

    .empty{
      border:1px dashed var(--line);
      background: transparent;
      box-shadow:none;
    }

    /* Responsive */
    @media (max-width: 900px){
      .grid{grid-template-columns: repeat(2, minmax(0,1fr));}
      .dow{display:none;}
      .day{min-height: 180px;}
      input[type="search"]{min-width: 180px; width:100%;}
      .right{justify-content:flex-start;}
    }
    @media (max-width: 640px){
      .grid{grid-template-columns: 1fr;}
      .logo-img{height:56px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="https://www.dacvarest.fr/wp-content/uploads/2024/12/logodacvarest-svg.png"
             alt="Logo DAC Var Est"
             class="logo-img">
        <div class="title">
          <b>Agenda territorial — DAC Var Est</b>
          <span>Calendrier partagé (alimenté automatiquement via Google Sheet)</span>
        </div>
      </div>

      <div class="right">
        <div class="legend">
          <div class="chip"><span class="dot event"></span> Événement / atelier / animation</div>
          <div class="chip"><span class="dot info"></span> Info / news / actualité</div>
        </div>

        <div class="selectors">
          <select id="month"></select>
          <select id="year"></select>

          <select id="typeFilter">
            <option value="">Tous types</option>
          </select>

          <input id="search" type="search" placeholder="Rechercher (titre, ville, lieu)..." />

          <label class="check" title="Affiche uniquement les jours qui contiennent au moins un événement (par défaut)">
            <input id="onlyWithEvents" type="checkbox" checked>
            Uniquement jours avec événements
          </label>
        </div>
      </div>
    </div>

    <div class="monthTitle">
      <h2 id="monthLabel">—</h2>
      <div class="hint" id="status">Chargement…</div>
    </div>

    <div class="grid" id="dowRow"></div>
    <div class="grid" id="calendar"></div>
  </div>

  <!-- Modal zoom infographie -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modalCard" role="dialog" aria-modal="true" aria-label="Aperçu infographie">
      <div class="modalBar">
        <div id="modalTitle">Infographie</div>
        <button id="modalClose" type="button">Fermer</button>
      </div>
      <div class="modalBody">
        <img id="modalImg" alt="Infographie" />
      </div>
    </div>
  </div>

<script>
/** ✅ Colle ton lien CSV publié ici */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGpQYOcOHDjE8YyA1WjJDxGZE3JFBKwpBvMQzIaWiekbf5HNf11owqJFjU9PsaRcExANXdFPhul_In/pub?gid=229654026&single=true&output=csv";

/** Réglages */
const DOW_LABELS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

// Couleurs par défaut par type (si colonne "couleur" vide)
const TYPE_COLORS = {
  "info": "#FFE9D6",
  "webinaire": "#EAF2FF",
  "atelier": "#E7FFF2",
  "événement": "#FFF7CC",
  "evenement": "#FFF7CC",
  "default": "#F8FAFC"
};

const els = {
  month: document.getElementById("month"),
  year: document.getElementById("year"),
  typeFilter: document.getElementById("typeFilter"),
  search: document.getElementById("search"),
  onlyWithEvents: document.getElementById("onlyWithEvents"),
  monthLabel: document.getElementById("monthLabel"),
  status: document.getElementById("status"),
  dowRow: document.getElementById("dowRow"),
  calendar: document.getElementById("calendar"),
  modal: document.getElementById("modal"),
  modalImg: document.getElementById("modalImg"),
  modalTitle: document.getElementById("modalTitle"),
  modalClose: document.getElementById("modalClose"),
};

function normalize(s){
  return (s ?? "").toString().trim();
}
function normKey(s){
  return normalize(s).toLowerCase()
    .normalize("NFD").replace(/\p{Diacritic}/gu,"");
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let cur = "";
  let inQuotes = false;

  for (let i=0; i<text.length; i++){
    const c = text[i];
    const next = text[i+1];

    if (c === '"' && inQuotes && next === '"'){ cur += '"'; i++; continue; }
    if (c === '"'){ inQuotes = !inQuotes; continue; }

    if (c === "," && !inQuotes){
      row.push(cur); cur=""; continue;
    }
    if ((c === "\n" || c === "\r") && !inQuotes){
      if (c === "\r" && next === "\n") i++;
      row.push(cur); cur="";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      continue;
    }
    cur += c;
  }
  row.push(cur);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

function toISODate(yyyy_mm_dd){
  const s = normalize(yyyy_mm_dd);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  if (Number.isNaN(dt.getTime())) return null;
  return dt;
}

function setSelectOptions(){
  els.month.innerHTML = "";
  for (let m=0; m<12; m++){
    const opt = document.createElement("option");
    opt.value = String(m+1).padStart(2,"0");
    opt.textContent = MONTHS_FR[m].replace(/^\w/, c => c.toUpperCase());
    els.month.appendChild(opt);
  }
  els.year.innerHTML = "";
  const now = new Date();
  const thisY = now.getFullYear();
  for (let y=thisY-1; y<=thisY+3; y++){
    const opt = document.createElement("option");
    opt.value = String(y);
    opt.textContent = String(y);
    els.year.appendChild(opt);
  }
  els.month.value = String(now.getMonth()+1).padStart(2,"0");
  els.year.value = String(thisY);
}

function renderDow(){
  els.dowRow.innerHTML = "";
  for (const lab of DOW_LABELS){
    const div = document.createElement("div");
    div.className = "dow";
    div.textContent = lab;
    els.dowRow.appendChild(div);
  }
}

function monthLabel(y, m){
  return `Agenda – ${MONTHS_FR[m-1].replace(/^\w/, c => c.toUpperCase())} ${y}`;
}

function firstGridDate(y, m){
  const first = new Date(Date.UTC(y, m-1, 1));
  const dow = (first.getUTCDay() + 6) % 7; // 0=lun ... 6=dim
  const start = new Date(first);
  start.setUTCDate(first.getUTCDate() - dow);
  return start;
}

function isWeekend(utcDate){
  const day = utcDate.getUTCDay();
  return day === 0 || day === 6;
}

function safeLink(url){
  const u = normalize(url);
  if (!u) return null;
  if (/^https?:\/\//i.test(u)) return u;
  return null;
}

/* ✅ Convertit (souvent) un lien Google Drive de partage en lien direct image */
function driveToDirect(url){
  const u = normalize(url);
  if (!u) return null;

  // déjà direct
  if (/\.(png|jpg|jpeg|webp|gif)(\?.*)?$/i.test(u)) return u;

  // formats Drive classiques
  // https://drive.google.com/file/d/FILE_ID/view?usp=sharing
  const m1 = u.match(/drive\.google\.com\/file\/d\/([^/]+)/i);
  if (m1 && m1[1]) return `https://drive.google.com/uc?export=view&id=${m1[1]}`;

  // https://drive.google.com/open?id=FILE_ID
  const m2 = u.match(/[?&]id=([^&]+)/i);
  if (m2 && m2[1] && u.includes("drive.google.com")) return `https://drive.google.com/uc?export=view&id=${m2[1]}`;

  // Google Photos & autres -> on ne force pas
  return u;
}

function buildTypeOptions(events){
  const types = Array.from(new Set(events.map(e => e.type).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"fr"));
  els.typeFilter.innerHTML = `<option value="">Tous types</option>`;
  for (const t of types){
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    els.typeFilter.appendChild(opt);
  }
}

function colorForEvent(e){
  if (normalize(e.couleur)) return e.couleur;
  const key = normKey(e.type);
  return TYPE_COLORS[key] || TYPE_COLORS.default;
}

function eventMatchesFilters(e){
  const tf = normalize(els.typeFilter.value);
  if (tf && e.type !== tf) return false;

  const q = normKey(els.search.value);
  if (!q) return true;

  const hay = normKey([e.titre, e.ville, e.lieu, e.type].join(" "));
  return hay.includes(q);
}

function escapeHtml(s){
  return normalize(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function openModal(title, imgUrl){
  els.modalTitle.textContent = title || "Infographie";
  els.modalImg.src = imgUrl;
  els.modal.classList.add("open");
  els.modal.setAttribute("aria-hidden","false");
}

function closeModal(){
  els.modal.classList.remove("open");
  els.modal.setAttribute("aria-hidden","true");
  els.modalImg.src = "";
}

els.modalClose.addEventListener("click", closeModal);
els.modal.addEventListener("click", (e)=>{
  if (e.target === els.modal) closeModal();
});
document.addEventListener("keydown", (e)=>{
  if (e.key === "Escape") closeModal();
});

function typeBadgeStyle(type){
  const k = normKey(type);
  if (k.includes("info")) return "background: rgba(252,165,165,.28);";
  if (k.includes("web")) return "background: rgba(191,219,254,.30);";
  if (k.includes("atelier")) return "background: rgba(167,243,208,.30);";
  if (k.includes("evenement") || k.includes("événement") || k.includes("event")) return "background: rgba(253,230,138,.35);";
  return "background: rgba(255,255,255,.75);";
}

function renderEventCard(e){
  const bg = colorForEvent(e);
  const link = safeLink(e.lien);

  const timeStr = (e.heure_debut || e.heure_fin)
    ? `${e.heure_debut || ""}${(e.heure_debut && e.heure_fin) ? " à " : ""}${e.heure_fin || ""}`.trim()
    : "";

  const whereStr = [e.ville, e.lieu].filter(Boolean).join(" · ");

  // ✅ Infographie (si colonne infographie remplie)
  const infRaw = normalize(e.infographie);
  const infUrl = infRaw ? driveToDirect(infRaw) : null;
  const safeInf = safeLink(infUrl);

  const card = document.createElement("div");
  card.className = "card";
  card.style.background = bg;

  const badge = e.type
    ? `<span class="badge" style="${typeBadgeStyle(e.type)}">${escapeHtml(e.type)}</span>`
    : "";

  card.innerHTML = `
    <div class="cardInner">
      <div class="cardTop">
        <h4>${escapeHtml(e.titre || "Événement")}</h4>
        ${badge}
      </div>

      <div class="meta">
        ${timeStr ? `<span>🕒 ${escapeHtml(timeStr)}</span>` : ""}
        ${whereStr ? `<span>📍 ${escapeHtml(whereStr)}</span>` : ""}
      </div>

      <div class="links">
        ${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${escapeHtml(e.etiquette || "En savoir plus")}</a>` : ""}
        ${safeInf ? `<a href="${safeInf}" target="_blank" rel="noopener noreferrer">Ouvrir l’infographie</a>` : ""}
      </div>

      ${safeInf ? `
        <div class="thumbWrap">
          <div class="thumbTitle">
            <span>Infographie</span>
            <span style="opacity:.8">Clique pour zoom</span>
          </div>
          <div class="thumb" data-title="${escapeHtml(e.titre || "Infographie")}" data-img="${escapeHtml(safeInf)}">
            <img src="${escapeHtml(safeInf)}" alt="Infographie ${escapeHtml(e.titre || "")}" loading="lazy">
          </div>
        </div>
      ` : ""}
    </div>
  `;

  // hook zoom
  const t = card.querySelector(".thumb");
  if (t){
    t.addEventListener("click", ()=>{
      const title = t.getAttribute("data-title") || "Infographie";
      const img = t.getAttribute("data-img");
      if (img) openModal(title, img);
    });
  }

  return card;
}

function renderCalendar(eventsAll){
  const y = Number(els.year.value);
  const m = Number(els.month.value); // 1-12

  els.monthLabel.textContent = monthLabel(y,m);
  els.dowRow.style.display = "";

  const eventsMonth = eventsAll
    .filter(e => e.y === y && e.m === m)
    .filter(eventMatchesFilters);

  const byDay = new Map();
  for (const e of eventsMonth){
    const key = e.d;
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  for (const [k, arr] of byDay){
    arr.sort((a,b) => (a.heure_debut||"").localeCompare(b.heure_debut||""));
  }

  els.calendar.innerHTML = "";
  const onlyWithEvents = !!els.onlyWithEvents?.checked;

  if (!onlyWithEvents){
    const start = firstGridDate(y, m);
    const daysToRender = 42;

    for (let i=0; i<daysToRender; i++){
      const dt = new Date(start);
      dt.setUTCDate(start.getUTCDate() + i);

      const cell = document.createElement("div");
      const inMonth = (dt.getUTCFullYear() === y && (dt.getUTCMonth()+1) === m);

      cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "") + (!inMonth ? " empty" : "");

      if (!inMonth){
        els.calendar.appendChild(cell);
        continue;
      }

      const d = dt.getUTCDate();
      const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];
      cell.innerHTML = `
        <div class="num">
          <strong>${d}</strong>
          <small>${dow}</small>
        </div>
        <div class="events"></div>
      `;

      const slot = cell.querySelector(".events");
      const dayEvents = byDay.get(d) || [];
      for (const e of dayEvents){
        slot.appendChild(renderEventCard(e));
      }

      els.calendar.appendChild(cell);
    }

    els.status.textContent = `${eventsMonth.length} élément(s) affiché(s)`;
    return;
  }

  // jours avec événements (compact + clean)
  els.dowRow.style.display = "none";

  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let d=1; d<=daysInMonth; d++){
    const dayEvents = byDay.get(d) || [];
    if (dayEvents.length === 0) continue;

    const dt = new Date(Date.UTC(y, m-1, d));
    const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];

    const cell = document.createElement("div");
    cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "");
    cell.innerHTML = `
      <div class="num">
        <strong>${d}</strong>
        <small>${dow}</small>
      </div>
      <div class="events"></div>
    `;

    const slot = cell.querySelector(".events");
    for (const e of dayEvents){
      slot.appendChild(renderEventCard(e));
    }
    els.calendar.appendChild(cell);
  }

  els.status.textContent = `${eventsMonth.length} élément(s) affiché(s)`;
}

async function loadEvents(){
  els.status.textContent = "Chargement…";

  if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("COLLE_TON_LIEN_CSV_ICI")){
    els.status.textContent = "⚠️ Tu dois coller l’URL CSV Google Sheet dans le code.";
    return [];
  }

  const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
  if (!res.ok){
    els.status.textContent = "⚠️ Impossible de charger la Google Sheet (lien CSV ? publication ?).";
    return [];
  }
  const text = await res.text();
  const rows = parseCSV(text);
  if (rows.length < 2){
    els.status.textContent = "⚠️ Aucune donnée (vérifie les colonnes et la publication).";
    return [];
  }

  const header = rows[0].map(h => normKey(h));
  const idx = (name) => header.indexOf(normKey(name));

  if (idx("date") === -1 || idx("titre") === -1){
    els.status.textContent = "⚠️ Colonnes obligatoires manquantes : date + titre.";
    return [];
  }

  // ✅ colonne optionnelle
  const idxInf = idx("infographie");

  const evts = [];
  for (let i=1; i<rows.length; i++){
    const r = rows[i];
    const dateStr = r[idx("date")] ?? "";
    const dt = toISODate(dateStr);
    if (!dt) continue;

    const y = dt.getUTCFullYear();
    const m = dt.getUTCMonth()+1;
    const d = dt.getUTCDate();

    const e = {
      date: dateStr,
      y,m,d,
      titre: r[idx("titre")] ?? "",
      type: r[idx("type")] ?? "",
      heure_debut: r[idx("heure_debut")] ?? "",
      heure_fin: r[idx("heure_fin")] ?? "",
      ville: r[idx("ville")] ?? "",
      lieu: r[idx("lieu")] ?? "",
      lien: r[idx("lien")] ?? "",
      etiquette: r[idx("etiquette")] ?? "En savoir plus",
      couleur: r[idx("couleur")] ?? "",
      infographie: (idxInf !== -1 ? (r[idxInf] ?? "") : "")
    };

    if (normalize(e.titre)) evts.push(e);
  }

  els.status.textContent = `${evts.length} événement(s) chargé(s)`;
  return evts;
}

(async function init(){
  setSelectOptions();
  renderDow();

  let eventsAll = [];
  try{
    eventsAll = await loadEvents();
  } catch(err){
    console.error(err);
    els.status.textContent = "⚠️ Erreur lors du chargement (console pour détails).";
    return;
  }

  buildTypeOptions(eventsAll);
  renderCalendar(eventsAll);

  const refresh = () => renderCalendar(eventsAll);
  els.month.addEventListener("change", refresh);
  els.year.addEventListener("change", refresh);
  els.typeFilter.addEventListener("change", refresh);
  els.search.addEventListener("input", refresh);
  els.onlyWithEvents.addEventListener("change", refresh);
})();
</script>
