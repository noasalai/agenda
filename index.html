<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Agenda dacvarest.fr</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --card:#f8fafc;
      --shadow: 0 6px 18px rgba(15,23,42,.08);
      --radius:14px;
      --gap:14px;
    }

    .logo-img{height:100px;width:auto;}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:var(--bg);
    }
    .wrap{
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 18px 32px;
    }

    /* Header */
    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding: 10px 0 18px;
      border-bottom:1px solid var(--line);
      margin-bottom: 18px;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      min-width:260px;
    }
    .brand .title{line-height:1.2;}
    .brand .title b{display:block;font-size:16px}
    .brand .title span{font-size:12px;color:var(--muted)}
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      font-size:12px;
      color:var(--muted);
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
      white-space:nowrap;
    }
    .chip .dot{
      width:10px;height:10px;border-radius:999px;
      background:#93c5fd;
      border:1px solid rgba(15,23,42,.08);
    }
    .chip .dot.info{background:#fca5a5}
    .chip .dot.atelier{background:#a7f3d0}
    .chip .dot.event{background:#fde68a}
    .selectors{
      display:flex; gap:10px; align-items:center;
      flex-wrap:wrap;
    }
    select, input[type="search"]{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      background:#fff;
      outline:none;
      min-height:40px;
    }
    input[type="search"]{min-width: 240px}

    /* Checkbox */
    .check{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      font-size:13px;
      color:var(--muted);
      white-space:nowrap;
    }
    .check input{ accent-color:#1d4ed8; }

    /* Calendar grid */
    .monthTitle{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      margin: 12px 0 12px;
    }
    .monthTitle h2{
      margin:0;
      font-size:20px;
      letter-spacing:.2px;
    }
    .monthTitle .hint{color:var(--muted); font-size:12px}

    .grid{
      display:grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: var(--gap);
    }
    .dow{
      font-weight:700;
      color:#334155;
      font-size:13px;
      padding: 6px 4px;
    }
    .day{
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      min-height: 165px;
      padding: 10px 10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      box-shadow: 0 1px 0 rgba(15,23,42,.02);
      min-width:0;
    }
    .day.isWeekend{ background: #f3f4f6; }
    .day .num{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .day .num strong{ font-size:16px; }
    .day .num small{ color:var(--muted); font-size:12px; }
    .events{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .card{
      border-radius: 14px;
      padding: 10px 10px 10px;
      background: var(--card);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 1px 0 rgba(15,23,42,.03);
      overflow:hidden;
      min-width:0;

      cursor:pointer;
      transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
      outline:none;
    }
    .card:hover{
      border-color: rgba(29,78,216,.22);
      box-shadow: 0 8px 26px rgba(15,23,42,.10);
      transform: translateY(-1px);
    }
    .card:focus-visible{
      box-shadow: 0 0 0 3px rgba(29,78,216,.22), 0 10px 30px rgba(15,23,42,.10);
      border-color: rgba(29,78,216,.35);
    }

    .card .row1{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      min-width:0;
    }
    .badge{
      font-size:11px;
      color:#0f172a;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(15,23,42,.08);
      white-space:nowrap;
    }
    .card h4{
      margin: 0 0 6px;
      font-size:13px;
      line-height:1.25;
      overflow-wrap:anywhere;
      word-break:break-word;
      min-width:0;
    }
    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color: var(--muted);
      font-size:12px;
      margin-bottom: 8px;
    }
    .meta span{
      display:inline-flex;
      align-items:center;
      gap:6px;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .links{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .links a{
      font-size:12px;
      color:#1d4ed8;
      text-decoration:none;
      padding: 6px 10px;
      border-radius: 10px;
      border:1px solid rgba(29,78,216,.20);
      background:#fff;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .links a:hover{
      border-color: rgba(29,78,216,.45);
      box-shadow: 0 2px 10px rgba(29,78,216,.10);
    }

    .empty{
      border:1px dashed var(--line);
      background: transparent;
      box-shadow:none;
    }

    /* ✅ MODAL (mini-fenêtre) */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 9999;
    }
    .modalBack.show{ display:flex; }

    .modal{
      width: min(980px, 100%);
      max-height: min(88vh, 980px);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 22px 80px rgba(15,23,42,.35);
      overflow: hidden;
      border: 1px solid rgba(15,23,42,.12);
      display:flex;
      flex-direction:column;
    }
    .modalHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }
    .modalTitle{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }
    .modalTitle b{
      font-size:16px;
      line-height:1.25;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .modalTitle .sub{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color: var(--muted);
      font-size:12px;
    }
    .closeBtn{
      border:1px solid rgba(15,23,42,.14);
      background:#fff;
      border-radius: 12px;
      padding: 8px 10px;
      cursor:pointer;
      font-size:14px;
      line-height:1;
      box-shadow: 0 1px 0 rgba(15,23,42,.03);
    }
    .closeBtn:hover{ box-shadow: 0 8px 18px rgba(15,23,42,.10); }

    .modalBody{
      padding: 14px 16px 16px;
      overflow:auto;
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .modalActions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:flex-start;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 12px;
      border:1px solid rgba(29,78,216,.22);
      background:#fff;
      color:#1d4ed8;
      font-size:14px;
      text-decoration:none;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{ box-shadow: 0 10px 22px rgba(29,78,216,.10); border-color: rgba(29,78,216,.40); }

    .viewer{
      border: 1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      overflow:hidden;
      background: #f8fafc;
      min-height: 320px;
    }
    .viewer img{
      display:block;
      width:100%;
      height:auto;
    }
    .viewer iframe{
      width:100%;
      height: 70vh;
      min-height: 520px;
      border:0;
      display:block;
      background:#fff;
    }
    .viewerEmpty{
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    /* Responsive */
    @media (max-width: 900px){
      .grid{grid-template-columns: repeat(2, minmax(0,1fr));}
      .dow{display:none;}
      .day{min-height: 180px;}
      input[type="search"]{min-width: 180px; width:100%;}
      .controls{justify-content:flex-start;}
      .viewer iframe{height: 62vh; min-height: 420px;}
    }
    @media (max-width: 640px){
      .grid{grid-template-columns: 1fr;}
      .modalHead{ padding: 12px 12px; }
      .modalBody{ padding: 12px 12px 14px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="https://www.dacvarest.fr/wp-content/uploads/2024/12/logodacvarest-svg.png"
             alt="Logo DAC Var Est"
             class="logo-img">
        <div class="title">
          <b>Agenda dacvarest.fr</b>
          <span></span>
        </div>
      </div>

      <div class="controls">
        <div class="chip"><span class="dot event"></span> Événement / atelier / animation</div>
        <div class="chip"><span class="dot info"></span> Info / news / actualité</div>

        <div class="selectors">
          <select id="month"></select>
          <select id="year"></select>
          <select id="typeFilter">
            <option value="">Tous types</option>
          </select>
          <input id="search" type="search" placeholder="Rechercher (titre, ville, lieu)..." />

          <label class="check" title="Affiche uniquement les jours qui contiennent au moins un événement (par défaut)">
            <input id="onlyWithEvents" type="checkbox" checked>
            Afficher uniquement les jours avec événements
          </label>
        </div>
      </div>
    </div>

    <div class="monthTitle">
      <h2 id="monthLabel">—</h2>
      <div class="hint" id="status">Chargement…</div>
    </div>

    <div class="grid" id="dowRow"></div>
    <div class="grid" id="calendar"></div>
  </div>

  <!-- ✅ MODAL -->
  <div class="modalBack" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHead">
        <div class="modalTitle">
          <b id="modalTitle">—</b>
          <div class="sub" id="modalSub"></div>
          <div class="modalActions" id="modalActions"></div>
        </div>
        <button class="closeBtn" id="modalClose" aria-label="Fermer">✕</button>
      </div>
      <div class="modalBody">
        <div class="viewer" id="modalViewer">
          <div class="viewerEmpty">—</div>
        </div>
      </div>
    </div>
  </div>

<script>
/** ✅ Colle ton lien CSV publié ici */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGpQYOcOHDjE8YyA1WjJDxGZE3JFBKwpBvMQzIaWiekbf5HNf11owqJFjU9PsaRcExANXdFPhul_In/pub?gid=229654026&single=true&output=csv";

/** Réglages */
const WEEK_START = 1; // 1 = lundi (FR)
const DOW_LABELS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

// Couleurs par défaut par type (si colonne "couleur" vide)
const TYPE_COLORS = {
  "info": "#FFE9D6",
  "webinaire": "#EAF2FF",
  "atelier": "#E7FFF2",
  "événement": "#FFF7CC",
  "evenement": "#FFF7CC",
  "default": "#F8FAFC"
};

const els = {
  month: document.getElementById("month"),
  year: document.getElementById("year"),
  typeFilter: document.getElementById("typeFilter"),
  search: document.getElementById("search"),
  onlyWithEvents: document.getElementById("onlyWithEvents"),
  monthLabel: document.getElementById("monthLabel"),
  status: document.getElementById("status"),
  dowRow: document.getElementById("dowRow"),
  calendar: document.getElementById("calendar"),

  modalBack: document.getElementById("modalBack"),
  modalClose: document.getElementById("modalClose"),
  modalTitle: document.getElementById("modalTitle"),
  modalSub: document.getElementById("modalSub"),
  modalActions: document.getElementById("modalActions"),
  modalViewer: document.getElementById("modalViewer"),
};

let __eventsAll = [];

function normalize(s){ return (s ?? "").toString().trim(); }

function normKey(s){
  return normalize(s).toLowerCase()
    .normalize("NFD").replace(/\p{Diacritic}/gu,""); // enlève accents
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let cur = "";
  let inQuotes = false;

  for (let i=0; i<text.length; i++){
    const c = text[i];
    const next = text[i+1];

    if (c === '"' && inQuotes && next === '"'){ cur += '"'; i++; continue; }
    if (c === '"'){ inQuotes = !inQuotes; continue; }

    if (c === "," && !inQuotes){
      row.push(cur); cur=""; continue;
    }
    if ((c === "\n" || c === "\r") && !inQuotes){
      if (c === "\r" && next === "\n") i++;
      row.push(cur); cur="";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      continue;
    }
    cur += c;
  }
  row.push(cur);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

function toISODate(yyyy_mm_dd){
  const s = normalize(yyyy_mm_dd);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  if (Number.isNaN(dt.getTime())) return null;
  return dt;
}

function setSelectOptions(){
  els.month.innerHTML = "";
  for (let m=0; m<12; m++){
    const opt = document.createElement("option");
    opt.value = String(m+1).padStart(2,"0");
    opt.textContent = MONTHS_FR[m].replace(/^\w/, c => c.toUpperCase());
    els.month.appendChild(opt);
  }
  els.year.innerHTML = "";
  const now = new Date();
  const thisY = now.getFullYear();
  for (let y=thisY-1; y<=thisY+3; y++){
    const opt = document.createElement("option");
    opt.value = String(y);
    opt.textContent = String(y);
    els.year.appendChild(opt);
  }
  els.month.value = String(now.getMonth()+1).padStart(2,"0");
  els.year.value = String(thisY);
}

function renderDow(){
  els.dowRow.innerHTML = "";
  for (const lab of DOW_LABELS){
    const div = document.createElement("div");
    div.className = "dow";
    div.textContent = lab;
    els.dowRow.appendChild(div);
  }
}

function monthLabel(y, m){
  return `Agenda – ${MONTHS_FR[m-1].replace(/^\w/, c => c.toUpperCase())} ${y}`;
}

function firstGridDate(y, m){
  const first = new Date(Date.UTC(y, m-1, 1));
  const dow = (first.getUTCDay() + 6) % 7; // 0=lun ... 6=dim
  const start = new Date(first);
  start.setUTCDate(first.getUTCDate() - dow);
  return start;
}

function isWeekend(utcDate){
  const day = utcDate.getUTCDay();
  return day === 0 || day === 6;
}

function safeLink(url){
  const u = normalize(url);
  if (!u) return null;
  if (/^https?:\/\//i.test(u)) return u;
  return null;
}

/* ✅ Google Drive share -> preview embed (si besoin) */
function toDrivePreview(url){
  const u = normalize(url);
  if (!u) return null;

  // Formats classiques : https://drive.google.com/file/d/<ID>/view?...
  const m1 = u.match(/drive\.google\.com\/file\/d\/([^\/]+)\//i);
  if (m1 && m1[1]) return `https://drive.google.com/file/d/${m1[1]}/preview`;

  // https://drive.google.com/open?id=<ID>
  const m2 = u.match(/[?&]id=([^&]+)/i);
  if (u.includes("drive.google.com") && m2 && m2[1]) return `https://drive.google.com/file/d/${m2[1]}/preview`;

  return null;
}

function isImageUrl(url){
  const u = normalize(url).toLowerCase();
  return /\.(png|jpe?g|webp|gif)(\?.*)?$/.test(u);
}

function isPdfUrl(url){
  const u = normalize(url).toLowerCase();
  return /\.pdf(\?.*)?$/.test(u);
}

function buildTypeOptions(events){
  const types = Array.from(new Set(events.map(e => e.type).filter(Boolean)))
    .sort((a,b)=>a.localeCompare(b,"fr"));
  els.typeFilter.innerHTML = `<option value="">Tous types</option>`;
  for (const t of types){
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    els.typeFilter.appendChild(opt);
  }
}

function colorForEvent(e){
  if (normalize(e.couleur)) return e.couleur;
  const key = normKey(e.type);
  return TYPE_COLORS[key] || TYPE_COLORS.default;
}

function eventMatchesFilters(e){
  const tf = normalize(els.typeFilter.value);
  if (tf && e.type !== tf) return false;

  const q = normKey(els.search.value);
  if (!q) return true;

  const hay = normKey([e.titre, e.ville, e.lieu, e.type].join(" "));
  return hay.includes(q);
}

function escapeHtml(s){
  return normalize(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(e){
  const timeStr = (e.heure_debut || e.heure_fin)
    ? `${e.heure_debut || ""}${(e.heure_debut && e.heure_fin) ? " à " : ""}${e.heure_fin || ""}`.trim()
    : "";
  return timeStr;
}

function formatWhere(e){
  return [e.ville, e.lieu].filter(Boolean).join(" · ");
}

/* ✅ MODAL */
function closeModal(){
  els.modalBack.classList.remove("show");
  els.modalBack.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}

function openModal(e){
  els.modalTitle.textContent = e.titre || "Événement";

  const timeStr = formatTime(e);
  const whereStr = formatWhere(e);
  const dateLabel = normalize(e.date) ? e.date : "";
  const chips = [];

  if (e.type) chips.push(`🏷️ ${escapeHtml(e.type)}`);
  if (dateLabel) chips.push(`📅 ${escapeHtml(dateLabel)}`);
  if (timeStr) chips.push(`🕒 ${escapeHtml(timeStr)}`);
  if (whereStr) chips.push(`📍 ${escapeHtml(whereStr)}`);

  els.modalSub.innerHTML = chips.map(x => `<span>${x}</span>`).join("");

  // Actions
  els.modalActions.innerHTML = "";
  const link = safeLink(e.lien);
  if (link){
    const a = document.createElement("a");
    a.className = "btn";
    a.href = link;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "Ouvrir le lien";
    els.modalActions.appendChild(a);
  }

  // Viewer (affiche)
  let affiche = safeLink(e.affiche);

  // Fallback : si pas d’affiche, et que lien est image/pdf -> on l’utilise
  if (!affiche && link && (isImageUrl(link) || isPdfUrl(link) || toDrivePreview(link))) {
    affiche = link;
  }

  // Drive preview si applicable
  const drivePrev = affiche ? toDrivePreview(affiche) : null;

  els.modalViewer.innerHTML = "";

  if (!affiche){
    const div = document.createElement("div");
    div.className = "viewerEmpty";
    div.textContent = "Pas d’affiche renseignée pour cet événement (colonne 'affiche').";
    els.modalViewer.appendChild(div);
  } else if (drivePrev){
    const iframe = document.createElement("iframe");
    iframe.src = drivePrev;
    iframe.title = "Affiche (Google Drive)";
    iframe.loading = "lazy";
    els.modalViewer.appendChild(iframe);
  } else if (isPdfUrl(affiche)){
    const iframe = document.createElement("iframe");
    iframe.src = affiche;
    iframe.title = "Affiche (PDF)";
    iframe.loading = "lazy";
    els.modalViewer.appendChild(iframe);
  } else if (isImageUrl(affiche)){
    const img = document.createElement("img");
    img.src = affiche;
    img.alt = "Affiche de l'événement";
    img.loading = "lazy";
    els.modalViewer.appendChild(img);
  } else {
    const div = document.createElement("div");
    div.className = "viewerEmpty";
    div.innerHTML = `Lien d’affiche non reconnu (mets une image .jpg/.png/.webp ou un PDF).<br><br>
      <a class="btn" href="${affiche}" target="_blank" rel="noopener noreferrer">Ouvrir l’affiche</a>`;
    els.modalViewer.appendChild(div);
  }

  // Show
  els.modalBack.classList.add("show");
  els.modalBack.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}

function renderEventCard(e){
  const bg = colorForEvent(e);
  const link = safeLink(e.lien);

  const timeStr = formatTime(e);
  const whereStr = formatWhere(e);

  const card = document.createElement("div");
  card.className = "card";
  card.style.background = bg;
  card.tabIndex = 0;
  card.setAttribute("role","button");
  card.setAttribute("aria-label", `Ouvrir le détail : ${normalize(e.titre) || "Événement"}`);

  card.innerHTML = `
    <div class="row1">
      <h4>${escapeHtml(e.titre || "Événement")}</h4>
      ${e.type ? `<span class="badge">${escapeHtml(e.type)}</span>` : ""}
    </div>
    <div class="meta">
      ${timeStr ? `<span>🕒 ${escapeHtml(timeStr)}</span>` : ""}
      ${whereStr ? `<span>📍 ${escapeHtml(whereStr)}</span>` : ""}
    </div>
    <div class="links">
      ${link ? `<a class="eventLink" href="${link}" target="_blank" rel="noopener noreferrer">${escapeHtml(e.etiquette || "Lien")}</a>` : ""}
    </div>
  `;

  // ✅ Clic ouvre modal (sauf si on clique sur le lien)
  card.addEventListener("click", () => openModal(e));
  card.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" || ev.key === " "){
      ev.preventDefault();
      openModal(e);
    }
  });

  const a = card.querySelector("a.eventLink");
  if (a){
    a.addEventListener("click", (ev) => ev.stopPropagation());
  }

  return card;
}

function renderCalendar(eventsAll){
  const y = Number(els.year.value);
  const m = Number(els.month.value); // 1-12

  els.monthLabel.textContent = monthLabel(y,m);
  els.dowRow.style.display = "";

  const eventsMonth = eventsAll
    .filter(e => e.y === y && e.m === m)
    .filter(eventMatchesFilters);

  const byDay = new Map();
  for (const e of eventsMonth){
    const key = e.d;
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  for (const [k, arr] of byDay){
    arr.sort((a,b) => (a.heure_debut||"").localeCompare(b.heure_debut||""));
  }

  els.calendar.innerHTML = "";
  const onlyWithEvents = !!els.onlyWithEvents?.checked;

  if (!onlyWithEvents){
    const start = firstGridDate(y, m);
    const daysToRender = 42;

    for (let i=0; i<daysToRender; i++){
      const dt = new Date(start);
      dt.setUTCDate(start.getUTCDate() + i);

      const cell = document.createElement("div");
      const inMonth = (dt.getUTCFullYear() === y && (dt.getUTCMonth()+1) === m);

      cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "") + (!inMonth ? " empty" : "");

      if (!inMonth){
        els.calendar.appendChild(cell);
        continue;
      }

      const d = dt.getUTCDate();
      const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];
      cell.innerHTML = `
        <div class="num">
          <strong>${d}</strong>
          <small>${dow}</small>
        </div>
        <div class="events"></div>
      `;

      const slot = cell.querySelector(".events");
      const dayEvents = byDay.get(d) || [];
      for (const e of dayEvents){
        slot.appendChild(renderEventCard(e));
      }

      els.calendar.appendChild(cell);
    }

    els.status.textContent = `${eventsMonth.length} élément(s) affiché(s)`;
    return;
  }

  els.dowRow.style.display = "none";

  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let d=1; d<=daysInMonth; d++){
    const dayEvents = byDay.get(d) || [];
    if (dayEvents.length === 0) continue;

    const dt = new Date(Date.UTC(y, m-1, d));
    const dow = DOW_LABELS[((dt.getUTCDay()+6)%7)];

    const cell = document.createElement("div");
    cell.className = "day" + (isWeekend(dt) ? " isWeekend" : "");
    cell.innerHTML = `
      <div class="num">
        <strong>${d}</strong>
        <small>${dow}</small>
      </div>
      <div class="events"></div>
    `;

    const slot = cell.querySelector(".events");
    for (const e of dayEvents){
      slot.appendChild(renderEventCard(e));
    }
    els.calendar.appendChild(cell);
  }

  els.status.textContent = `${eventsMonth.length} élément(s) affiché(s)`;
}

async function loadEvents(){
  els.status.textContent = "Chargement…";

  if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("COLLE_TON_LIEN_CSV_ICI")){
    els.status.textContent = "⚠️ Tu dois coller l’URL CSV Google Sheet dans le code.";
    return [];
  }

  const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
  if (!res.ok){
    els.status.textContent = "⚠️ Impossible de charger la Google Sheet (lien CSV ? publication ?).";
    return [];
  }
  const text = await res.text();
  const rows = parseCSV(text);
  if (rows.length < 2){
    els.status.textContent = "⚠️ Aucune donnée (vérifie les colonnes et la publication).";
    return [];
  }

  const header = rows[0].map(h => normKey(h));
  const idx = (name) => header.indexOf(normKey(name));

  const pick = (row, names) => {
    for (const n of names){
      const i = idx(n);
      if (i !== -1) return row[i] ?? "";
    }
    return "";
  };

  const hasDate = idx("date") !== -1;
  const hasTitle = idx("titre") !== -1;

  if (!hasDate || !hasTitle){
    els.status.textContent = "⚠️ Colonnes obligatoires manquantes : date + titre.";
    return [];
  }

  const evts = [];
  for (let i=1; i<rows.length; i++){
    const r = rows[i];
    const dateStr = r[idx("date")] ?? "";
    const dt = toISODate(dateStr);
    if (!dt) continue;

    const y = dt.getUTCFullYear();
    const m = dt.getUTCMonth()+1;
    const d = dt.getUTCDate();

    const e = {
      date: dateStr,
      y,m,d,
      titre: pick(r, ["titre"]),
      type: pick(r, ["type"]),
      heure_debut: pick(r, ["heure_debut","heure debut","debut","heure début"]),
      heure_fin: pick(r, ["heure_fin","heure fin","fin","heure fin"]),
      ville: pick(r, ["ville","commune"]),
      lieu: pick(r, ["lieu","adresse","salle"]),
      lien: pick(r, ["lien","url","inscription","reservation"]),
      etiquette: pick(r, ["etiquette","libelle","label","bouton"]) || "Lien",
      couleur: pick(r, ["couleur","color"]),
      // ✅ nouvelle colonne : "affiche" (ou variantes)
      affiche: pick(r, ["affiche","visuel","image","poster","flyer","photo"])
    };

    if (normalize(e.titre)) evts.push(e);
  }

  els.status.textContent = `${evts.length} événement(s) chargé(s)`;
  return evts;
}

(function bindModal(){
  els.modalClose.addEventListener("click", closeModal);

  // clic dehors = ferme
  els.modalBack.addEventListener("click", (ev) => {
    if (ev.target === els.modalBack) closeModal();
  });

  // ESC = ferme
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && els.modalBack.classList.contains("show")){
      closeModal();
    }
  });
})();

(async function init(){
  setSelectOptions();
  renderDow();

  try{
    __eventsAll = await loadEvents();
  } catch(err){
    console.error(err);
    els.status.textContent = "⚠️ Erreur lors du chargement (console pour détails).";
    return;
  }

  buildTypeOptions(__eventsAll);
  renderCalendar(__eventsAll);

  const refresh = () => renderCalendar(__eventsAll);
  els.month.addEventListener("change", refresh);
  els.year.addEventListener("change", refresh);
  els.typeFilter.addEventListener("change", refresh);
  els.search.addEventListener("input", refresh);
  els.onlyWithEvents.addEventListener("change", refresh);
})();
</script>
